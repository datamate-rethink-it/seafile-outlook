<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../shared/shared.css">
  <style>
    body { padding: 0; }
    .pane-body { padding: 12px; }
  </style>
</head>
<body>
  <div class="pane-header">
    <h3 data-i18n="saveToSeafile">Save to Seafile</h3>
    <button class="settings-btn" id="openSettings" title="Settings">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>

  <div id="notConfigured" class="empty-msg" style="display:none">
    <p data-i18n="notConfigured">No Seafile account configured.</p>
    <button class="primary" id="setupBtn" style="margin-top:8px;">Open Settings</button>
  </div>

  <div id="loading" class="empty-msg" data-i18n="loading">Loading...</div>
  <div id="noAttachments" class="empty-msg" style="display:none" data-i18n="noAttachments">No attachments found.</div>

  <div id="content" style="display:none" class="pane-body">
    <div id="accountSelector" class="form-group" style="display:none">
      <select id="accountSelect"></select>
    </div>

    <div class="form-group">
      <label for="repoSelect" data-i18n="targetLibrary">Target Library</label>
      <select id="repoSelect"></select>
    </div>
    <label data-i18n="targetFolder">Target folder</label>
    <div class="folder-picker" id="folderPicker">
      <div class="current-path" id="currentPath"><span class="path-text">/</span><span class="toggle-arrow"><svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="currentColor"/></svg></span></div>
      <ul class="folder-list" id="folderList" data-empty="No subfolders" data-i18n-empty="noSubfolders"></ul>
    </div>

    <div class="select-all">
      <input type="checkbox" id="selectAll" checked>
      <label for="selectAll" data-i18n="selectAll">Select all</label>
    </div>
    <ul class="attachment-list" id="attachmentList"></ul>

    <button id="saveBtn" class="primary" data-i18n="saveToSeafile">Save to Seafile</button>
    <div id="saveStatus" class="status"></div>
  </div>

  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="../api/seafile.js"></script>
  <script src="../shared/file-icons.js"></script>
  <script src="../shared/utils.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="read.js"></script>
</body>
</html>
